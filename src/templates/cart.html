{% extends 'base.html' %}
{% block content %}
<h1>Мій кошик</h1>
<ul class="list-group">
    {% for item in items %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        {{ item.name }} - {{ item.price }} грн
        <a href="{{ url_for('remove_from_cart', product_id=item.id) }}" class="btn btn-danger btn-sm">Видалити</a>
    </li>
    {% endfor %}
</ul>

<h3 class="mt-3">Загальна сума: {{ total }} грн</h3>

<a href="/" class="btn btn-primary mt-3">Назад до магазину</a>
{% endblock %}
