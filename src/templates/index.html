{% extends 'base.html' %}
{% block content %}
<h1 class="mb-4">Каталог товарів</h1>
<div class="row">
    {% for product in products %}
    <div class="col-md-4">
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ product.name }}</h5>
                <p class="card-text">{{ product.price }} грн</p>
                <a href="{{ url_for('add_to_cart', product_id=product.id) }}" class="btn btn-success">Додати в кошик</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
